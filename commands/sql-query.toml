name = "sql-query"
description = "Execute a SQL SELECT query against the PostgreSQL database."

prompt = """
Execute the following SQL query against the PostgreSQL database using the execute_sql tool:

{{query}}

Return at most {{limit}} rows. Format results as a table with column headers.
"""

[parameters]
query = { type = "string", description = "SQL SELECT query to execute", required = true }
limit = { type = "number", description = "Maximum rows to return (default: 100)", default = 100 }
